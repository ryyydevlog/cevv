<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cevv — Young developer</title>
  <meta name="description" content="Cevv's personal digital home: projects, writing, and links." />
  <style>
    /* =========================================
       Cevv landing page
       Change --accent to change the whole vibe.
       ========================================= */
    :root {
      --bg: #101014;
      --surface: #17171d;
      --text: #e8e6e1;
      --muted: #a3a1a0;
      --accent: #b8a47e;
      --border: #2a2a33;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(circle at 20% 15%, rgba(184, 164, 126, 0.09), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      text-align: center;
    }

    .home {
      max-width: 620px;
      width: 100%;
    }

    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.8rem;
      overflow: hidden;
    }

    /* Replace this span with:
       <img src="your-photo.jpg" alt="Cevv" /> */
    .avatar span { padding: 0 0.5rem; }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .accent { color: var(--accent); }

    .intro {
      margin: 1rem auto 2.25rem;
      max-width: 30rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .links {
      display: grid;
      gap: 0.7rem;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.15rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease, color 0.18s ease;
    }

    .links a:hover,
    .links a:focus-visible {
      transform: translateY(-2px);
      border-color: var(--accent);
      color: var(--accent);
    }

    .links a span:last-child {
      color: var(--muted);
      transition: color 0.18s ease;
    }

    .links a:hover span:last-child,
    .links a:focus-visible span:last-child {
      color: var(--accent);
    }

    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      .links a { padding: 0.9rem 1rem; }
    }
  </style>
</head>
<body>
  <main class="home">
    <!-- Replace this with your photo later -->
    <div class="avatar">
      <img src="pruyy.jpg" alt="Cevv" />
    </div>

    <h1>Greetings,<span class="accent">cevv</span>.</h1>

    <p class="intro">
      developer &amp; writer. I make things with code, write poems,
      and share the stuff I’m curious about.
    </p>

    <!-- Replace every # with your real link -->
    <nav class="links" aria-label="My links">
      <a href="#projects">Projects <span>&rarr;</span></a>
      <a href="#writing">Writing <span>&rarr;</span></a>
      <a href="https://instagram.com/rye.archieve">Instagram <span>&rarr;</span></a>
      <a href="https://github.com/ryyy.devlog">Github <span>&rarr;</span></a>
      <a href="https://youtube.com/@ryyy.devlog">Youtube <span>&rarr;</span></a>
      <a href="https://tiktok.com/@ryyyarchive">Tiktok <span>&rarr;</span></a>
      <a href="https://discord.gg/WTJfKGdb">Discord <span>&rarr;</span></a>
      <a href="mailto:ryyy.devlog@gmail.com">Email <span>&rarr;</span></a>
    </nav>

    <footer>&copy; cevv &middot; my little corner of the internet</footer>
  </main>
</body>
</html>
